    html[data-tema="aurora"]      {--bg:#080e18;--surface:#0e1628;--surface2:#141e34;--border:#203050;--gold:#40c8c0;--gold-light:#70f0e8;--gold-dim:#208880;--text:#c0ecf0;--text-dim:#408890;--ov1:rgba(8,14,24,.75);--ov2:rgba(8,14,24,.92);--ov3:rgba(8,14,24,.97);--gl1:rgba(40,180,180,.12);--gl2:rgba(20,140,140,.09);}
    html[data-tema="sangue"]      {--bg:#120404;--surface:#200606;--surface2:#2c0808;--border:#480c0c;--gold:#cc1010;--gold-light:#ff3030;--gold-dim:#880808;--text:#f0c0c0;--text-dim:#884040;--ov1:rgba(18,4,4,.75);--ov2:rgba(18,4,4,.92);--ov3:rgba(18,4,4,.97);--gl1:rgba(200,10,10,.12);--gl2:rgba(160,8,8,.09);}

    html[data-tema="abobora"]     {--bg:#160c04;--surface:#221404;--surface2:#2e1a06;--border:#5a2e08;--gold:#e06010;--gold-light:#ff8030;--gold-dim:#903808;--text:#f0d8c0;--text-dim:#906040;--ov1:rgba(22,12,4,.75);--ov2:rgba(22,12,4,.92);--ov3:rgba(22,12,4,.97);--gl1:rgba(210,80,10,.12);--gl2:rgba(170,60,8,.09);}

    html[data-tema="abismo"]      {--bg:#020204;--surface:#060608;--surface2:#08080c;--border:#141420;--gold:#3838a8;--gold-light:#6868d8;--gold-dim:#202070;--text:#c0c0e0;--text-dim:#404060;--ov1:rgba(2,2,4,.80);--ov2:rgba(2,2,4,.95);--ov3:rgba(2,2,4,.99);--gl1:rgba(40,40,140,.10);--gl2:rgba(25,25,100,.07);}
    html[data-tema="lava"]        {--bg:#100202;--surface:#1e0404;--surface2:#2a0606;--border:#4e0e0e;--gold:#f02020;--gold-light:#ff5050;--gold-dim:#a00808;--text:#ffc8c8;--text-dim:#984040;--ov1:rgba(16,2,2,.75);--ov2:rgba(16,2,2,.92);--ov3:rgba(16,2,2,.97);--gl1:rgba(230,20,20,.15);--gl2:rgba(190,10,10,.10);}

    body {
      background-color:var(--bg);
      background-image:url('https://i.imgur.com/mJoCBsb.png'),
        radial-gradient(ellipse at 20% 0%,var(--gl1) 0%,transparent 60%),
        radial-gradient(ellipse at 80% 100%,var(--gl2) 0%,transparent 60%);
      background-repeat:no-repeat;background-position:center top;
      background-size:cover;background-attachment:fixed;
      color:var(--text);font-family:'Raleway',sans-serif;
      font-weight:300;min-height:100vh;overflow-x:hidden;
    }
    body::before{content:'';position:fixed;inset:0;background:linear-gradient(to bottom,var(--ov1) 0%,var(--ov2) 40%,var(--ov3) 100%);pointer-events:none;z-index:0;}
    body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;}

    .page{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 20px 80px;}

    /* HAMBURGER */
    .hamburger {
      position:fixed;top:16px;left:16px;z-index:1000;
      width:42px;height:42px;
      background:var(--surface2);border:1px solid var(--border);border-radius:6px;
      cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
      transition:border-color 0.2s,box-shadow 0.2s;
    }
    .hamburger:hover{border-color:var(--gold-dim);box-shadow:0 0 12px rgba(42,127,212,0.20);}
    .hamburger span{display:block;width:18px;height:1.5px;background:var(--text-dim);border-radius:2px;transition:all 0.3s ease;}
    .hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);background:var(--gold-light);}
    .hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
    .hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);background:var(--gold-light);}

    /* DRAWER */
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:998;opacity:0;pointer-events:none;transition:opacity 0.3s ease;}
    .drawer-overlay.open{opacity:1;pointer-events:all;}
    .drawer{position:fixed;top:0;left:0;width:260px;height:100vh;background:var(--surface);border-right:1px solid var(--border);z-index:999;transform:translateX(-100%);transition:transform 0.3s ease;overflow-y:auto;padding:70px 0 40px;}
    .drawer.open{transform:translateX(0);}
    .drawer-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--text-dim);padding:0 20px 10px;border-bottom:1px solid var(--border);margin-bottom:8px;}
    .drawer-section-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold-dim);padding:12px 20px 4px;}
    .drawer-btn{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 20px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.08em;color:var(--text-dim);cursor:pointer;transition:background 0.15s,color 0.15s;}
    .drawer-btn:hover{background:var(--surface2);color:var(--gold-light);}
    .drawer-btn.ativo{color:var(--gold-light);background:var(--surface2);border-left:2px solid var(--gold);}
    .drawer-divider{border:none;border-top:1px solid var(--border);margin:8px 0;}
    .drawer-gear{display:flex;align-items:center;gap:10px;margin:16px 16px 0;padding:10px 14px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;transition:border-color 0.2s;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.1em;color:var(--text-dim);width:calc(100% - 32px);}
    .drawer-gear:hover{border-color:var(--gold-dim);color:var(--gold-light);}

    /* HEADER */
    header{padding:50px 0 36px;text-align:center;}
    .header-line{width:60px;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:0 auto 18px;}
    header h1{font-family:'FaithCollapsing','Cinzel Decorative',serif;font-size:clamp(28px,7vw,54px);letter-spacing:.08em;background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 50%,var(--gold-dim) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 24px var(--gold-dim));}
    header p{margin-top:10px;font-family:'Cinzel',serif;font-size:clamp(10px,2vw,12px);letter-spacing:.3em;text-transform:uppercase;color:var(--text-dim);}

    /* SECTION DIVIDER */
    .section-divider{display:flex;align-items:center;gap:16px;margin:32px 0 20px;}
    .section-divider-line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--border));}
    .section-divider-line.r{background:linear-gradient(to left,transparent,var(--border));}
    .section-divider-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;}

    /* FILTROS */
    .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
    .filtro-btn{background:linear-gradient(160deg,var(--surface2) 0%,var(--surface) 100%);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;padding:8px 16px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;transition:all .2s;display:flex;align-items:center;gap:6px;}
    .filtro-btn:hover{color:var(--gold-light);border-color:var(--gold-dim);}
    .filtro-btn.ativo{background:linear-gradient(135deg,rgba(42,127,212,.2),rgba(42,127,212,.06));border-color:var(--gold);color:var(--gold-light);}

    /* GALERIA */
    .galeria-grid{columns:3;gap:12px;column-gap:12px;}
    @media(max-width:600px){.galeria-grid{columns:2;}}
    @media(max-width:380px){.galeria-grid{columns:1;}}
    .foto-item{break-inside:avoid;margin-bottom:12px;position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all .2s;background:var(--surface);}
    .foto-item::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,var(--gold-dim),transparent);opacity:0;transition:opacity .2s;z-index:1;}
    .foto-item:hover{border-color:var(--gold-dim);}
    .foto-item:hover::before{opacity:1;}
    .foto-item img{width:100%;display:block;transition:transform .3s;}
    .foto-item:hover img{transform:scale(1.03);}
    .foto-overlay{position:absolute;bottom:0;left:0;right:0;padding:10px 12px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);opacity:0;transition:opacity .2s;}
    .foto-item:hover .foto-overlay{opacity:1;}
    .foto-pessoa{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;color:var(--gold-light);}
    .sem-fotos{text-align:center;padding:60px 20px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);}

    /* LIGHTBOX */
    .lightbox{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.92);align-items:center;justify-content:center;}
    .lightbox.aberto{display:flex;}
    .lb-inner{position:relative;max-width:92vw;max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:14px;}
    .lb-img{max-width:100%;max-height:78vh;border-radius:8px;border:1px solid var(--border);display:block;}
    .lb-info{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;}
    .lb-pessoa{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-light);}
    .lb-fechar{position:fixed;top:20px;right:20px;background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);cursor:pointer;padding:8px 14px;font-size:18px;line-height:1;transition:all .2s;}
    .lb-fechar:hover{color:var(--gold-light);border-color:var(--gold-dim);}
    .lb-nav{background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);cursor:pointer;padding:10px 16px;font-size:20px;line-height:1;transition:all .2s;}
    .lb-nav:hover{color:var(--gold-light);border-color:var(--gold-dim);}
    .lb-nav-wrap{display:flex;gap:10px;align-items:center;}
    .lb-download{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);text-decoration:none;border:1px solid var(--border);padding:8px 16px;border-radius:4px;transition:all .2s;cursor:pointer;background:none;}
    .lb-download:hover{color:var(--gold-light);border-color:var(--gold-dim);}

    /* MODAL ADM */
    .adm-overlay{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.25s;}
    .adm-overlay.open{opacity:1;pointer-events:all;}
    .adm-modal{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:8px;padding:32px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;position:relative;}
    .adm-modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,var(--gold-dim),transparent);}
    .adm-modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;transition:color 0.2s;}
    .adm-modal-close:hover{color:var(--gold-light);}
    .adm-modal-title{font-family:'Cinzel Decorative',serif;font-size:15px;color:var(--gold-light);margin-bottom:8px;}
    .adm-modal-sub{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);margin-bottom:24px;}

    /* TABS ADM */
    .adm-tabs{display:flex;gap:0;margin-bottom:24px;border-radius:6px;overflow:hidden;border:1px solid var(--border);}
    .adm-tab{flex:1;background:none;border:none;color:var(--text-dim);cursor:pointer;padding:10px 6px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;transition:all .2s;}
    .adm-tab.ativo{background:linear-gradient(135deg,rgba(42,127,212,.2),rgba(42,127,212,.06));color:var(--gold-light);}
    .tab-panel{display:none;}
    .tab-panel.ativo{display:block;}

    .adm-label{display:block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
    .adm-input,.adm-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:10px 14px;font-family:'Raleway',sans-serif;font-size:14px;margin-bottom:18px;transition:border-color .2s;}
    .adm-input:focus,.adm-select:focus{border-color:var(--gold-dim);}
    .adm-select option{background:var(--bg);}
    .adm-btn{width:100%;background:linear-gradient(135deg,rgba(42,127,212,.2),rgba(42,127,212,.08));border:1px solid var(--gold-dim);border-radius:5px;color:var(--gold-light);cursor:pointer;padding:12px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;transition:all .2s;margin-top:4px;}
    .adm-btn:hover{box-shadow:0 0 16px var(--gold-dim);}
    .adm-btn:disabled{opacity:.5;cursor:not-allowed;}
    .adm-btn-danger{background:linear-gradient(135deg,rgba(255,85,85,.15),rgba(255,85,85,.05));border-color:#aa3333;color:#ff5555;}
    .adm-btn-danger:hover{box-shadow:0 0 16px rgba(255,85,85,.3);}
    .adm-btn-outline{background:none;border-color:var(--border);color:var(--text-dim);}
    .adm-msg{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;text-align:center;margin-top:12px;min-height:18px;}
    .adm-msg.ok{color:var(--gold-light);}
    .adm-msg.err{color:var(--red);}

    .upload-progress{height:4px;background:var(--border);border-radius:2px;margin-top:-10px;margin-bottom:18px;overflow:hidden;display:none;}
    .upload-progress-fill{height:100%;background:linear-gradient(to right,var(--gold-dim),var(--gold-light));width:0%;transition:width .2s;}

    .adm-section-label{font-family:'Cinzel',serif;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin:20px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border);}

    /* FOOTER */
    footer{position:relative;z-index:1;text-align:center;padding:40px 0;border-top:1px solid var(--border);margin-top:60px;}
    .footer-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:16px;}
    .footer-links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
    .footer-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);text-decoration:none;border:1px solid var(--border);padding:8px 16px;border-radius:4px;transition:all .2s;}
    .footer-btn:hover{color:var(--gold-light);border-color:var(--gold-dim);}

    @font-face{font-family:'FaithCollapsing';src:url('FaithCollapsing.ttf') format('truetype');font-weight:normal;font-style:normal;}
    @font-face{font-family:'DropShade';src:url('DropShade.ttf') format('truetype');font-weight:normal;font-style:normal;}
  </style>
</head>
<body>

<!-- HAMBURGUER -->
<button class="hamburger" id="hamburger" onclick="toggleDrawer()">
  <span></span><span></span><span></span>
</button>

<!-- OVERLAY -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- DRAWER -->
<div class="drawer" id="drawer">
  <div class="drawer-title">Navegação</div>

  <div class="drawer-section-label">Páginas</div>
  <button class="drawer-btn" onclick="location.href='index.html';closeDrawer()">🏠 Início</button>
  <button class="drawer-btn ativo" onclick="closeDrawer()">📸 Galeria</button>
  <button class="drawer-btn" onclick="location.href='trollgers.html';closeDrawer()">📖 Trollgers</button>
  <button class="drawer-btn" onclick="location.href='sounds.html';closeDrawer()">🎵 Sons</button>

  <hr class="drawer-divider">

  <!-- ENGRENAGEM ADM -->
  <button class="drawer-gear" id="drawerGearBtn" onclick="abrirAdm();closeDrawer()">⚙️ Painel ADM</button>
</div>

<!-- MODAL ADM -->
<div class="adm-overlay" id="admOverlay">
  <div class="adm-modal">
    <button class="adm-modal-close" onclick="fecharAdm()">✕</button>
    <div class="adm-modal-title">⚙️ Painel ADM</div>
    <div class="adm-modal-sub">Acesso restrito — Trollgianismo</div>

    <!-- LOGIN -->
    <div id="admLoginPanel">
      <label class="adm-label">E-mail</label>
      <input class="adm-input" id="admEmail" type="email" placeholder="trollgianismo@gmail.com">
      <label class="adm-label">Senha</label>
      <input class="adm-input" id="admSenha" type="password" placeholder="••••••••">
      <button class="adm-btn" onclick="loginAdm()">Entrar</button>
      <div class="adm-msg" id="loginMsg"></div>
    </div>

    <!-- PAINEL LOGADO -->
    <div id="admPainelLogado" style="display:none;">
      <div class="adm-tabs">
        <button class="adm-tab ativo" id="tabUpload" onclick="mudarTab('upload')">Upload</button>
        <button class="adm-tab" id="tabPessoa" onclick="mudarTab('pessoa')">Nova Pessoa</button>
        <button class="adm-tab" id="tabGerenciar" onclick="mudarTab('gerenciar')">Gerenciar</button>
      </div>

      <!-- TAB UPLOAD -->
      <div class="tab-panel ativo" id="panelUpload">
        <label class="adm-label">Foto</label>
        <input class="adm-input" type="file" id="inputFoto" accept="image/*">
        <div class="upload-progress" id="uploadProgress"><div class="upload-progress-fill" id="uploadProgressFill"></div></div>
        <label class="adm-label">Pessoa</label>
        <select class="adm-select" id="selectPessoa"><option value="">Carregando...</option></select>
        <button class="adm-btn" id="btnEnviar" onclick="enviarFoto()">Enviar Foto</button>
        <div class="adm-msg" id="uploadMsg"></div>
      </div>

      <!-- TAB NOVA PESSOA -->
      <div class="tab-panel" id="panelPessoa">
        <label class="adm-label">Nome</label>
        <input class="adm-input" id="novaPessoaNome" placeholder="Ex: Davi">
        <label class="adm-label">Emoji</label>
        <input class="adm-input" id="novaPessoaEmoji" placeholder="Ex: ⚡" maxlength="4">
        <button class="adm-btn" onclick="criarPessoa()">Criar Pessoa</button>
        <div class="adm-msg" id="pessoaMsg"></div>
      </div>

      <!-- TAB GERENCIAR -->
      <div class="tab-panel" id="panelGerenciar">
        <label class="adm-label">ID da foto a excluir</label>
        <input class="adm-input" id="inputExcluirId" placeholder="Número do ID">
        <button class="adm-btn adm-btn-danger" onclick="excluirFoto()">Excluir Foto</button>
        <div class="adm-msg" id="gerenciarMsg"></div>
        <div class="adm-section-label"></div>
        <button class="adm-btn adm-btn-outline" onclick="fazerLogout()">Sair da Conta Admin</button>
      </div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="fecharLightboxBg(event)">
  <button class="lb-fechar" onclick="fecharLightbox()">✕</button>
  <div class="lb-inner" onclick="event.stopPropagation()">
    <img class="lb-img" id="lbImg" src="" alt="">
    <div class="lb-info">
      <div class="lb-nav-wrap">
        <button class="lb-nav" onclick="lbNavegar(-1)">◀</button>
        <span class="lb-pessoa" id="lbPessoa"></span>
        <button class="lb-nav" onclick="lbNavegar(1)">▶</button>
      </div>
      <button class="lb-download" onclick="baixarFoto()">⬇ Baixar</button>
    </div>
  </div>
</div>

<div class="page">
  <header>
    <div class="header-line"></div>
    <h1>Galeria</h1>
    <p>Memórias do Universo Trollger</p>
  </header>

  <div class="section-divider">
    <div class="section-divider-line"></div>
    <span class="section-divider-label">📸 Pessoas</span>
    <div class="section-divider-line r"></div>
  </div>

  <div class="filtros" id="filtrosWrap">
    <button class="filtro-btn ativo" data-id="todos" onclick="filtrar('todos',this)">🌐 Todos</button>
  </div>

  <div class="section-divider">
    <div class="section-divider-line"></div>
    <span class="section-divider-label">🖼 Fotos</span>
    <div class="section-divider-line r"></div>
  </div>

  <div class="galeria-grid" id="galeriaGrid">
    <div class="sem-fotos">Carregando...</div>
  </div>
</div>

<footer>
  <div class="footer-label">Trollgianismo — Universo Oficial</div>
  <div class="footer-links">
    <a href="index.html" class="footer-btn">← Início</a>
    <a href="trollgers.html" class="footer-btn">Trollgers</a>
    <a href="sounds.html" class="footer-btn">Sons</a>
  </div>
</footer>

<script>
  var SUPA_URL = 'https://jkxhqtvugpbxplsswuut.supabase.co';
  var SUPA_KEY = 'sb_publishable_X008-K40SDB9uSb7h1eS3w_9uTc11yl';
  var BUCKET   = 'galeria';
  var sb       = supabase.createClient(SUPA_URL, SUPA_KEY);

  var pessoas         = [];
  var fotos           = [];
  var fotosFiltradas  = [];
  var filtroAtual     = 'todos';
  var lbIdx           = 0;
  var admLogado       = false;

  /* ── INIT ── */
  document.addEventListener('DOMContentLoaded', function() {
    carregarTemaFonte();
    sb.auth.getSession().then(function(r) {
      if (r.data && r.data.session) { admLogado = true; mostrarPainelLogado(); }
    });
    carregarPessoas().then(function() { carregarFotos(); });
  });

  /* ── DRAWER ── */
  function toggleDrawer() {
    document.getElementById('drawer').classList.toggle('open');
    document.getElementById('drawerOverlay').classList.toggle('open');
    document.getElementById('hamburger').classList.toggle('open');
  }
  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
  }

  /* ── ADM MODAL ── */
  function abrirAdm() {
    document.getElementById('admOverlay').classList.add('open');
  }
  function fecharAdm() {
    document.getElementById('admOverlay').classList.remove('open');
  }
  document.getElementById('admOverlay').addEventListener('click', function(e) {
    if (e.target === this) fecharAdm();
  });

  function mostrarPainelLogado() {
    document.getElementById('admLoginPanel').style.display = 'none';
    document.getElementById('admPainelLogado').style.display = '';
    popularSelectPessoa();
  }

  function mudarTab(tab) {
    ['Upload','Pessoa','Gerenciar'].forEach(function(t) {
      document.getElementById('panel'+t).classList.toggle('ativo', t.toLowerCase()===tab);
      document.getElementById('tab'+t).classList.toggle('ativo', t.toLowerCase()===tab);
    });
  }

  /* ── LOGIN ── */
  async function loginAdm() {
    var email = document.getElementById('admEmail').value.trim();
    var senha = document.getElementById('admSenha').value;
    var msg   = document.getElementById('loginMsg');
    msg.textContent = 'Entrando...'; msg.className = 'adm-msg';
    var r = await sb.auth.signInWithPassword({ email: email, password: senha });
    if (r.error) { msg.textContent = r.error.message; msg.className = 'adm-msg err'; return; }
    admLogado = true;
    mostrarPainelLogado();
  }

  async function fazerLogout() {
    await sb.auth.signOut();
    admLogado = false;
    document.getElementById('admLoginPanel').style.display = '';
    document.getElementById('admPainelLogado').style.display = 'none';
    fecharAdm();
  }

  /* ── PESSOAS ── */
  async function carregarPessoas() {
    var r = await sb.from('galeria_pessoas').select('*').order('nome');
    if (r.error) { console.error(r.error); return; }
    pessoas = r.data || [];
    renderFiltros();
    popularSelectPessoa();
  }

  function renderFiltros() {
    var wrap = document.getElementById('filtrosWrap');
    var html = '<button class="filtro-btn'+(filtroAtual==='todos'?' ativo':'')+'" data-id="todos" onclick="filtrar(\'todos\',this)">🌐 Todos</button>';
    pessoas.forEach(function(p) {
      html += '<button class="filtro-btn'+(filtroAtual==p.id?' ativo':'')+'" data-id="'+p.id+'" onclick="filtrar('+p.id+',this)">'
        +esc(p.emoji||'👤')+' '+esc(p.nome)+'</button>';
    });
    wrap.innerHTML = html;
  }

  function popularSelectPessoa() {
    var sel = document.getElementById('selectPessoa');
    if (!sel) return;
    sel.innerHTML = '<option value="">Selecione...</option>';
    pessoas.forEach(function(p) {
      sel.innerHTML += '<option value="'+p.id+'">'+esc(p.emoji||'')+' '+esc(p.nome)+'</option>';
    });
  }

  async function criarPessoa() {
    var nome  = document.getElementById('novaPessoaNome').value.trim();
    var emoji = document.getElementById('novaPessoaEmoji').value.trim();
    var msg   = document.getElementById('pessoaMsg');
    if (!nome) { msg.textContent='Digite um nome.'; msg.className='adm-msg err'; return; }
    msg.textContent='Criando...'; msg.className='adm-msg';
    var r = await sb.from('galeria_pessoas').insert({ nome:nome, emoji:emoji||'👤' }).select().single();
    if (r.error) { msg.textContent=r.error.message; msg.className='adm-msg err'; return; }
    msg.textContent=nome+' adicionado(a)!'; msg.className='adm-msg ok';
    document.getElementById('novaPessoaNome').value='';
    document.getElementById('novaPessoaEmoji').value='';
    await carregarPessoas();
  }

  /* ── FOTOS ── */
  async function carregarFotos() {
    var r = await sb.from('galeria_fotos').select('*').order('criado_em', {ascending:false});
    if (r.error) { renderGaleria([]); return; }
    fotos = r.data || [];
    filtrar(filtroAtual, null);
  }

  function filtrar(id, btn) {
    filtroAtual = id;
    document.querySelectorAll('.filtro-btn').forEach(function(b){ b.classList.remove('ativo'); });
    if (btn) btn.classList.add('ativo');
    else { var t=document.querySelector('.filtro-btn[data-id="'+id+'"]'); if(t) t.classList.add('ativo'); }
    fotosFiltradas = id==='todos' ? fotos.slice() : fotos.filter(function(f){ return f.pessoa_id==id; });
    renderGaleria(fotosFiltradas);
  }

  function renderGaleria(lista) {
    var grid = document.getElementById('galeriaGrid');
    if (!lista.length) { grid.innerHTML='<div class="sem-fotos">Nenhuma foto ainda.</div>'; return; }
    grid.innerHTML = lista.map(function(f,i) {
      var p = pessoas.find(function(x){ return x.id==f.pessoa_id; });
      var nome = p ? esc(p.emoji||'')+ ' ' + esc(p.nome) : '';
      return '<div class="foto-item" onclick="abrirLightbox('+i+')">'
        +'<img src="'+esc(f.url)+'" alt="" loading="lazy" onerror="this.parentElement.style.display=\'none\'">'
        +'<div class="foto-overlay"><div class="foto-pessoa">'+nome+'</div></div>'
        +'</div>';
    }).join('');
  }

  /* ── UPLOAD ── */
  async function enviarFoto() {
    var input    = document.getElementById('inputFoto');
    var pessoaId = document.getElementById('selectPessoa').value;
    var msg      = document.getElementById('uploadMsg');
    var btn      = document.getElementById('btnEnviar');
    var prog     = document.getElementById('uploadProgress');
    var fill     = document.getElementById('uploadProgressFill');
    if (!input.files[0]) { msg.textContent='Selecione uma foto.'; msg.className='adm-msg err'; return; }
    if (!pessoaId)        { msg.textContent='Selecione a pessoa.'; msg.className='adm-msg err'; return; }
    var file = input.files[0];
    var ext  = file.name.split('.').pop();
    var path = 'fotos/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+ext;
    btn.disabled=true; prog.style.display='block'; fill.style.width='30%';
    msg.textContent='Enviando...'; msg.className='adm-msg';
    var upR = await sb.storage.from(BUCKET).upload(path, file, {upsert:false});
    if (upR.error) { msg.textContent=upR.error.message; msg.className='adm-msg err'; btn.disabled=false; prog.style.display='none'; return; }
    fill.style.width='70%';
    var url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    fill.style.width='90%';
    var insR = await sb.from('galeria_fotos').insert({url:url, pessoa_id:parseInt(pessoaId)});
    if (insR.error) { msg.textContent=insR.error.message; msg.className='adm-msg err'; btn.disabled=false; prog.style.display='none'; return; }
    fill.style.width='100%';
    msg.textContent='Foto enviada!'; msg.className='adm-msg ok';
    btn.disabled=false; input.value='';
    setTimeout(function(){ prog.style.display='none'; fill.style.width='0%'; }, 600);
    carregarFotos();
  }

  async function excluirFoto() {
    var id  = document.getElementById('inputExcluirId').value.trim();
    var msg = document.getElementById('gerenciarMsg');
    if (!id) { msg.textContent='Digite o ID.'; msg.className='adm-msg err'; return; }
    var foto = fotos.find(function(f){ return f.id==id; });
    if (!foto) { msg.textContent='Foto não encontrada.'; msg.className='adm-msg err'; return; }
    if (!confirm('Excluir esta foto permanentemente?')) return;
    msg.textContent='Excluindo...'; msg.className='adm-msg';
    var path = foto.url.split('/object/public/'+BUCKET+'/')[1];
    if (path) await sb.storage.from(BUCKET).remove([path]);
    var r = await sb.from('galeria_fotos').delete().eq('id', id);
    if (r.error) { msg.textContent=r.error.message; msg.className='adm-msg err'; return; }
    msg.textContent='Foto excluída.'; msg.className='adm-msg ok';
    document.getElementById('inputExcluirId').value='';
    carregarFotos();
  }

  /* ── LIGHTBOX ── */
  function abrirLightbox(idx) {
    lbIdx=idx; atualizarLightbox();
    document.getElementById('lightbox').classList.add('aberto');
    document.body.style.overflow='hidden';
  }
  function atualizarLightbox() {
    var f=fotosFiltradas[lbIdx]; if(!f) return;
    document.getElementById('lbImg').src=f.url;
    var p=pessoas.find(function(x){ return x.id==f.pessoa_id; });
    document.getElementById('lbPessoa').textContent=p?(p.emoji||'')+' '+p.nome:'';
  }
  function fecharLightbox() {
    document.getElementById('lightbox').classList.remove('aberto');
    document.getElementById('lbImg').src='';
    document.body.style.overflow='';
  }
  function fecharLightboxBg(e) { if(e.target===document.getElementById('lightbox')) fecharLightbox(); }
  function lbNavegar(dir) { lbIdx=(lbIdx+dir+fotosFiltradas.length)%fotosFiltradas.length; atualizarLightbox(); }
  async function baixarFoto() {
    var f=fotosFiltradas[lbIdx]; if(!f) return;
    try {
      var resp=await fetch(f.url); var blob=await resp.blob();
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='trollgianismo_'+f.id+'.'+(blob.type.split('/')[1]||'jpg');
      a.click(); URL.revokeObjectURL(a.href);
    } catch(e){ window.open(f.url,'_blank'); }
  }
  document.addEventListener('keydown',function(e){
    if(!document.getElementById('lightbox').classList.contains('aberto')) return;
    if(e.key==='ArrowLeft') lbNavegar(-1);
    if(e.key==='ArrowRight') lbNavegar(1);
    if(e.key==='Escape') fecharLightbox();
  });

  /* ── UTILS ── */
  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];}); }

  /* ── TEMA + FONTE ── */
  var _fs=null;
  function setFonteLocal(f){
    document.documentElement.setAttribute('data-fonte',f);
    if(!_fs){_fs=document.createElement('style');_fs.id='fonte-runtime';document.head.appendChild(_fs);}
    var ff=f==='dropshadow'?"'DropShade','Cinzel Decorative',serif":"'FaithCollapsing','Cinzel Decorative',serif";
    _fs.textContent='h1{font-family:'+ff+' !important;}';
    try{localStorage.setItem('tg-fonte',f);}catch(e){}
  }
  function carregarTemaFonte(){
    try{
      var ct=localStorage.getItem('tg-tema'); if(ct) document.documentElement.setAttribute('data-tema',ct);
      var cf=localStorage.getItem('tg-fonte'); if(cf) setFonteLocal(cf);
    }catch(e){}
    var sb2=supabase.createClient(SUPA_URL,SUPA_KEY);
    sb2.from('site_config').select('tema,fonte').eq('id',1).single().then(function(r){
      if(r.data){
        if(r.data.tema){document.documentElement.setAttribute('data-tema',r.data.tema);try{localStorage.setItem('tg-tema',r.data.tema);}catch(e){}}
        if(r.data.fonte) setFonteLocal(r.data.fonte); else setFonteLocal('faith');
      }
    });
  }
</script>
</body>
</html>

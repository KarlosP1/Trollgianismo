<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeos — Trollgianismo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a090f;
      --surface: #110f1a;
      --surface2: #1a1726;
      --border: #2a2540;
      --gold: #9b6fd4;
      --gold-light: #c49af0;
      --gold-dim: #5a3a8a;
      --text: #d4d0e0;
      --text-dim: #6a6480;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(120,60,200,0.10) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(80,40,160,0.07) 0%, transparent 60%);
      color: var(--text);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    @font-face {
      font-family: 'DropShade';
      src: url('https://files.catbox.moe/bsplgq.ttf');
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    header {
      padding: 50px 0 40px;
      text-align: center;
      animation: fadeDown 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }

    .header-line {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 0 auto 18px;
    }

    header h1 {
      font-family: 'DropShade', 'Cinzel Decorative', serif;
      font-size: clamp(26px, 6vw, 48px);
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 24px rgba(140,80,220,0.5));
    }

    header p {
      margin-top: 10px;
      font-family: 'Cinzel', serif;
      font-size: clamp(10px, 2vw, 12px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .header-line-bottom {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 18px auto 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 4px;
      background: var(--surface2);
      transition: all 0.2s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .back-link:hover { color: var(--gold-light); border-color: var(--gold-dim); }
    .back-link:focus, .back-link:focus-visible { outline: none; }

    .section-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 16px;
    }

    .video-card {
      background: linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 28px;
      position: relative;
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    .video-card:nth-child(2) { animation-delay: 0.1s; }
    .video-card:nth-child(3) { animation-delay: 0.2s; }

    .video-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
      z-index: 1;
    }

    .video-card iframe {
      width: 100%;
      height: clamp(220px, 45vw, 450px);
      border: none;
      display: block;
    }

    .spotify-card {
      background: linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 28px;
      position: relative;
      animation: fadeUp 0.6s 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }

    .spotify-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
      z-index: 1;
    }

    .spotify-header { padding: 20px 24px 0; }

    .spotify-header h2 {
      font-family: 'Cinzel', serif;
      font-size: clamp(13px, 2.5vw, 16px);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--gold-light);
    }

    .spotify-card iframe {
      width: 100%;
      border: none;
      display: block;
      margin-top: 12px;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .wrapper { padding: 0 14px 60px; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="header-line"></div>
    <h1>TROLLGIANISMO</h1>
    <p>Resenhas em Vídeo</p>
    <div class="header-line-bottom"></div>
  </header>

  <a href="index.html" class="back-link">← Voltar ao início</a>

  <div class="section-label">Vídeos</div>

  <div class="video-card">
    <iframe src="https://www.youtube.com/embed/wXPYENjrvmw"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
  </div>

  <div class="video-card">
    <iframe src="https://www.youtube.com/embed/DiOHhVhMKM4"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
  </div>

  <div class="video-card">
    <iframe src="https://www.youtube.com/embed/3cmcjhvvTak"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
  </div>

  <div class="video-card">
    <iframe src="https://www.youtube.com/embed/qhu2u_gmbRE"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
  </div>

  <div class="section-label" style="margin-top: 12px;">Playlist Oficial</div>

  <div class="spotify-card">
    <div class="spotify-header">
      <h2>Ouça nossa playlist no Spotify</h2>
    </div>
    <iframe
      src="https://open.spotify.com/embed/playlist/7pJ1prPkLI8gFofkHgI8UE?si=QZGp_485TpS6JkBxghUY9g"
      height="380"
      frameborder="0"
      allowtransparency="true"
      allow="encrypted-media">
    </iframe>
  </div>

  <div class="section-label" style="margin-top: 12px;">Playlist Oficial</div>

  <div class="spotify-card">
    <div class="spotify-header">
      <h2>Ouça minha playlist pessoal no YouTube music</h2>
    </div>
    <iframe
      src="https://www.youtube.com/embed/videoseries?list=PLuf5CtDQeBDXcGT3OgSvFb6OzxhiXXL6D"
      height="380"
      frameborder="0"
      allowtransparency="true"
      allow="encrypted-media">
    </iframe>
  </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteador de Times — Trollgianismo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a090f;
      --surface: #110f1a;
      --surface2: #1a1726;
      --border: #2a2540;
      --gold: #9b6fd4;
      --gold-light: #c49af0;
      --gold-dim: #5a3a8a;
      --blue-glow: #a78bfa;
      --text: #d4d0e0;
      --text-dim: #6a6480;
      --red: #cc3366;
    }

    body {
      background-color: var(--bg);
      background-image:
        url('https://i.imgur.com/mJoCBsb.png'),
        radial-gradient(ellipse at 20% 0%, rgba(120,60,200,0.1) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(80,40,160,0.08) 0%, transparent 60%);
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: linear-gradient(to bottom, rgba(8,6,18,0.75) 0%, rgba(10,9,15,0.90) 40%, rgba(10,9,15,0.97) 100%);
      pointer-events: none; z-index: 0;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    @font-face {
      font-family: 'DropShade';
      src: url('https://files.catbox.moe/bsplgq.ttf');
    }

    .page {
      position: relative; z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* HEADER */
    header { padding: 50px 0 36px; text-align: center; }
    .header-line { width: 60px; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); margin: 0 auto 18px; }
    header h1 {
      font-family: 'DropShade', 'Cinzel Decorative', serif;
      font-size: clamp(26px, 6vw, 52px);
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 24px rgba(140,80,220,0.5));
    }
    header p { margin-top: 10px; font-family: 'Cinzel', serif; font-size: clamp(10px, 2vw, 13px); letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); }

    /* CARD */
    .card {
      background: linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent, var(--gold-dim), transparent); }
    .card::after { content: ''; position: absolute; top: -60px; right: -60px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(120,60,200,0.07) 0%, transparent 70%); pointer-events: none; }

    .card-title { font-family: 'Cinzel Decorative', serif; font-size: clamp(16px, 3vw, 22px); color: var(--gold-light); margin-bottom: 28px; letter-spacing: 0.05em; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    /* NAV-BTN (botão padrão do site) */
    .nav-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: clamp(10px, 2.5vw, 12px);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      transition: color 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.15s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn:hover { color: var(--gold-light); border-color: var(--gold-dim); transform: translateY(-2px); }
    .nav-btn:active { transform: scale(0.96); }

    /* FOOTER */
    footer { text-align: center; padding: 30px 0 50px; border-top: 1px solid var(--border); }
    .footer-label { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 20px; }
    .footer-links { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .footer-btn { display: inline-block; padding: 11px 24px; border-radius: 4px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; transition: all 0.2s ease; outline: none; -webkit-tap-highlight-color: transparent; }
    .footer-btn:hover { border-color: var(--gold-dim); color: var(--gold-light); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(140,80,220,0.25), inset 0 0 16px rgba(140,80,220,0.08); }
      50% { box-shadow: 0 0 36px rgba(140,80,220,0.5), inset 0 0 28px rgba(140,80,220,0.15); }
    }
    @keyframes revealName {
      0% { opacity: 0; transform: scale(0.85) translateY(8px); filter: blur(6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    /* HAMBURGER */
    .hamburger {
      position: fixed; top: 16px; left: 16px; z-index: 1000;
      width: 42px; height: 42px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none; -webkit-tap-highlight-color: transparent;
    }
    .hamburger:hover { border-color: var(--gold-dim); box-shadow: 0 0 12px rgba(200,150,62,0.15); }
    .hamburger span { display: block; width: 18px; height: 1.5px; background: var(--text-dim); border-radius: 2px; transition: all 0.3s ease; }
    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); background: var(--gold-light); }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); background: var(--gold-light); }

    /* DRAWER */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 998; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }
    .drawer { position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: var(--surface); border-right: 1px solid var(--border); z-index: 999; transform: translateX(-100%); transition: transform 0.3s ease; overflow-y: auto; padding: 70px 0 40px; }
    .drawer.open { transform: translateX(0); }
    .drawer-title { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-dim); padding: 0 20px 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    a:focus, a:focus-visible { outline: none; }

    /* ===== SORTEADOR ===== */

    .sorteador-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 680px) {
      .sorteador-layout { grid-template-columns: 1fr; }
      .card { padding: 24px 18px; }
    }

    /* Painel de entrada */
    .input-section { display: flex; flex-direction: column; gap: 14px; }

    .input-row { display: flex; gap: 8px; }

    .name-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Raleway', sans-serif;
      font-size: 14px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.2s;
    }
    .name-input::placeholder { color: var(--text-dim); }
    .name-input:focus { border-color: var(--gold-dim); }

    .add-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 16px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      transition: color 0.2s, border-color 0.2s, transform 0.15s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .add-btn:hover { color: var(--gold-light); border-color: var(--gold-dim); transform: translateY(-1px); }
    .add-btn:active { transform: scale(0.96); }

    .counter {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-align: right;
    }
    .counter span { color: var(--gold); }

    /* Lista de nomes */
    .names-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .names-list::-webkit-scrollbar { width: 4px; }
    .names-list::-webkit-scrollbar-track { background: transparent; }
    .names-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .name-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text);
      animation: fadeIn 0.2s ease both;
      transition: border-color 0.2s;
    }
    .name-tag:hover { border-color: var(--gold-dim); }
    .name-tag.sorteado {
      border-color: var(--gold);
      color: var(--gold-light);
      background: linear-gradient(135deg, #1e1630, #160f24);
      box-shadow: 0 0 10px rgba(140,80,220,0.2);
    }

    .remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 16px;
      line-height: 1;
      padding: 0 0 0 10px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .remove-btn:hover { color: var(--red); }

    .empty-msg {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-align: center;
      padding: 20px 0;
    }

    /* Painel de resultado */
    .result-section { display: flex; flex-direction: column; gap: 20px; }

    .result-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .result-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent, var(--gold-dim), transparent); }

    .result-box.has-result {
      border-color: var(--gold-dim);
      animation: pulseGlow 2.5s ease infinite;
    }

    .result-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    .result-name {
      font-family: 'DropShade', 'Cinzel Decorative', serif;
      font-size: clamp(22px, 5vw, 36px);
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 60%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 16px rgba(140,80,220,0.5));
      animation: revealName 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      word-break: break-word;
    }

    .result-placeholder {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
    }

    .btn-group { display: flex; flex-direction: column; gap: 10px; }

    .sortear-btn {
      background: linear-gradient(135deg, #1e1630, #160f24);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 14px 24px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: clamp(11px, 2.5vw, 13px);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-light);
      box-shadow: 0 0 18px rgba(140,80,220,0.2), inset 0 0 16px rgba(140,80,220,0.06);
      transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .sortear-btn:hover { box-shadow: 0 0 28px rgba(140,80,220,0.4), inset 0 0 20px rgba(140,80,220,0.1); transform: translateY(-2px); }
    .sortear-btn:active { transform: scale(0.97); }
    .sortear-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .clear-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 24px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      transition: color 0.2s, border-color 0.2s, transform 0.15s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .clear-btn:hover { color: var(--red); border-color: #5a1a40; transform: translateY(-1px); }
    .clear-btn:active { transform: scale(0.96); }

    .error-msg {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--red);
      text-align: center;
      min-height: 16px;
    }

    /* ===== TIMES ===== */

    /* Roulette animation box */
    .roulette-box {
      background: var(--bg);
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: pulseGlow 0.6s ease infinite;
    }
    .roulette-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); }

    .roulette-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .roulette-name {
      font-family: 'DropShade', 'Cinzel Decorative', serif;
      font-size: clamp(18px, 4vw, 28px);
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 60%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 12px rgba(140,80,220,0.6));
      min-height: 36px;
      word-break: break-word;
    }

    /* Teams result grid */
    .teams-result {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }
    @media (max-width: 480px) {
      .teams-result { grid-template-columns: 1fr; }
    }

    .team-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 14px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.9) translateY(8px);
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22,1,0.36,1), border-color 0.3s, box-shadow 0.3s;
    }
    .team-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent, var(--gold-dim), transparent); }
    .team-box.revealed {
      opacity: 1;
      transform: scale(1) translateY(0);
      border-color: var(--gold-dim);
      box-shadow: 0 0 20px rgba(140,80,220,0.18), inset 0 0 14px rgba(140,80,220,0.06);
    }
    .team-box.revealed:hover {
      border-color: var(--gold);
      box-shadow: 0 0 28px rgba(140,80,220,0.3), inset 0 0 18px rgba(140,80,220,0.1);
    }

    .team-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .team-player {
      font-family: 'DropShade', 'Cinzel Decorative', serif;
      font-size: clamp(14px, 3vw, 18px);
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 60%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 10px rgba(140,80,220,0.4));
      padding: 6px 0;
      border-bottom: 1px solid rgba(90,58,138,0.3);
      word-break: break-word;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .team-player:last-child { border-bottom: none; }
    .team-player.visible { opacity: 1; transform: translateX(0); }

    /* Highlighted names in list after draw */
    .name-tag.no-time {
      opacity: 0.38;
    }
    .name-tag.em-time-1 {
      border-color: var(--gold);
      color: var(--gold-light);
      background: linear-gradient(135deg, #1e1630, #160f24);
      box-shadow: 0 0 10px rgba(140,80,220,0.2);
    }
    .name-tag.em-time-2 {
      border-color: var(--blue-glow);
      color: var(--blue-glow);
      background: linear-gradient(135deg, #101830, #0c1020);
      box-shadow: 0 0 10px rgba(167,139,250,0.2);
    }

    /* Novamente button */
    .novamente-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 20px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      transition: color 0.2s, border-color 0.2s, transform 0.15s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .novamente-btn:hover { color: var(--gold-light); border-color: var(--gold-dim); transform: translateY(-1px); }
    .novamente-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

<!-- HAMBURGER -->
<button class="hamburger" id="hamburger" onclick="toggleDrawer()">
  <span></span><span></span><span></span>
</button>

<!-- OVERLAY -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- DRAWER -->
<div class="drawer" id="drawer">
  <div class="drawer-title">Menu</div>
  <a href="index.html" style="display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:10px 14px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);text-decoration:none;transition:border-color 0.2s;outline:none;-webkit-tap-highlight-color:transparent" onmouseover="this.style.borderColor='var(--gold-dim)'" onmouseout="this.style.borderColor='var(--border)'">
    <span style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.1em;color:var(--text-dim)">← Voltar ao Site</span>
  </a>
</div>

<div class="page">

  <header>
    <div class="header-line"></div>
    <h1>SORTEADOR</h1>
    <p>Adicione 4+ nomes e sorteie os times</p>
  </header>

  <div class="card">
    <div class="card-title">Sorteio</div>

    <div class="sorteador-layout">

      <!-- COLUNA ESQUERDA: entrada + lista -->
      <div class="input-section">

        <div class="input-row">
          <input
            class="name-input"
            id="nameInput"
            type="text"
            maxlength="60"
            placeholder="Nome ou número..."
            onkeydown="handleKey(event)"
          >
          <button class="add-btn" onclick="addName()">Adicionar</button>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="counter">Lista: <span id="counter">0</span> / 50</div>

        <ul class="names-list" id="namesList">
          <li class="empty-msg" id="emptyMsg">Nenhum nome adicionado ainda.</li>
        </ul>

        <button class="clear-btn" onclick="clearAll()">Limpar tudo</button>

      </div>

      <!-- COLUNA DIREITA: resultado + botão -->
      <div class="result-section">

        <div class="result-box" id="resultBox">
          <div class="result-label">Resultado</div>
          <div class="result-placeholder" id="resultPlaceholder">Aguardando sorteio...<br><span style="font-size:10px;opacity:0.6;letter-spacing:0.15em">Mínimo 2 nomes</span></div>
        </div>

        <div class="btn-group">
          <button class="sortear-btn" id="sortearBtn" onclick="sortear()" disabled>Sortear Times</button>
          <button class="novamente-btn" id="novamenteBtn" onclick="sortearNovamente()" style="display:none">Sortear Novamente</button>
        </div>

      </div>

    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="index.html" class="footer-btn">← Voltar ao Site</a>
    </div>
  </footer>

</div>

<script>
  // ─── STATE ───────────────────────────────────────────
  var names = [];
  var sorteadosTime1 = [];   // nomes do time 1 (índices em names[])
  var sorteadosTime2 = [];   // nomes do time 2
  var isAnimating = false;

  // ─── INPUT ───────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter') addName();
  }

  function setError(msg) {
    document.getElementById('errorMsg').textContent = msg;
    if (msg) setTimeout(function() { document.getElementById('errorMsg').textContent = ''; }, 2500);
  }

  function addName() {
    var input = document.getElementById('nameInput');
    var val = input.value.trim();
    if (!val)                          { setError('Digite algo antes de adicionar.'); return; }
    if (names.length >= 50)            { setError('Limite de 50 itens atingido.'); return; }
    if (names.indexOf(val) !== -1)     { setError('Esse item já está na lista.'); return; }
    names.push(val);
    input.value = '';
    input.focus();
    renderList();
    updateBtn();
    setError('');
  }

  function removeName(idx) {
    names.splice(idx, 1);
    sorteadosTime1 = []; sorteadosTime2 = [];
    renderList();
    updateBtn();
  }

  function clearAll() {
    names = [];
    sorteadosTime1 = []; sorteadosTime2 = [];
    renderList();
    updateBtn();
    resetResult();
  }

  // ─── RENDER LIST ─────────────────────────────────────
  function renderList() {
    var ul = document.getElementById('namesList');
    document.getElementById('counter').textContent = names.length;

    if (names.length === 0) {
      ul.innerHTML = '<li class="empty-msg" id="emptyMsg">Nenhum nome adicionado ainda.</li>';
      return;
    }

    ul.innerHTML = '';
    names.forEach(function(n, i) {
      var li = document.createElement('li');
      var cls = 'name-tag';
      if (sorteadosTime1.indexOf(i) !== -1)      cls += ' em-time-1';
      else if (sorteadosTime2.indexOf(i) !== -1) cls += ' em-time-2';
      else if (sorteadosTime1.length > 0)        cls += ' no-time';
      li.className = cls;
      li.innerHTML =
        '<span>' + escapeHtml(n) + '</span>' +
        '<button class="remove-btn" onclick="removeName(' + i + ')" title="Remover">×</button>';
      ul.appendChild(li);
    });
  }

  function updateBtn() {
    var btn = document.getElementById('sortearBtn');
    btn.disabled = names.length < 2 || isAnimating;
  }

  function resetResult() {
    var box = document.getElementById('resultBox');
    box.classList.remove('has-result');
    box.innerHTML =
      '<div class="result-label">Resultado</div>' +
      '<div class="result-placeholder" id="resultPlaceholder">Aguardando sorteio...<br>' +
      '<span style="font-size:10px;opacity:0.6;letter-spacing:0.15em">Mínimo 2 nomes</span></div>';
    document.getElementById('novamenteBtn').style.display = 'none';
    sorteadosTime1 = []; sorteadosTime2 = [];
  }

  // ─── FISHER-YATES SHUFFLE ────────────────────────────
  function fisherYates(arr) {
    var a = arr.slice();  // cópia, não muta o original
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // ─── SORTEAR ─────────────────────────────────────────
  function sortear() {
    if (names.length < 2 || isAnimating) return;

    // Validação: exatamente 1 jogador não faz sentido (já bloqueado, mas por segurança)
    if (names.length === 1) { setError('Adicione pelo menos 2 nomes para sortear.'); return; }

    isAnimating = true;
    document.getElementById('sortearBtn').disabled = true;
    document.getElementById('novamenteBtn').style.display = 'none';

    // 1. Cópia + Fisher-Yates com TODOS os jogadores
    var shuffled = fisherYates(names);

    // 2. Divisão automática: ímpar → time1 fica com +1
    //    4 → 2×2 | 5 → 3×2 | 6 → 3×3 | 9 → 5×4
    var meio  = Math.ceil(shuffled.length / 2);
    var time1 = shuffled.slice(0, meio);
    var time2 = shuffled.slice(meio);

    // 3. Animação de roleta com TODOS os nomes embaralhados
    runRoulette(shuffled, function() {
      // Revela os times reais
      revealTeams(time1, time2);

      // Marca os índices em names[] para destacar na lista
      sorteadosTime1 = names.reduce(function(acc, n, i) {
        if (time1.indexOf(n) !== -1) acc.push(i);
        return acc;
      }, []);
      sorteadosTime2 = names.reduce(function(acc, n, i) {
        if (time2.indexOf(n) !== -1) acc.push(i);
        return acc;
      }, []);

      renderList();
      isAnimating = false;
      updateBtn();
      document.getElementById('novamenteBtn').style.display = '';
    });
  }

  function sortearNovamente() {
    sorteadosTime1 = []; sorteadosTime2 = [];
    renderList();
    resetResult();
    // Pequeno delay para o reset visível antes de rodar de novo
    setTimeout(function() { sortear(); }, 120);
  }

  // ─── ROULETTE ANIMATION ──────────────────────────────
  function runRoulette(allNames, onDone) {
    var box = document.getElementById('resultBox');
    box.classList.remove('has-result');

    // Monta o HTML da roleta
    box.innerHTML =
      '<div class="roulette-box" id="rouletteBox">' +
        '<div class="roulette-label">Sorteando...</div>' +
        '<div class="roulette-name" id="rouletteName">—</div>' +
      '</div>';

    var nameEl = document.getElementById('rouletteName');
    var totalMs   = 1800;   // duração total da animação
    var intervalMs = 55;    // troca a cada 55ms
    var elapsed   = 0;
    var speed     = intervalMs;

    var iv = setInterval(function() {
      elapsed += speed;

      // Escolhe nome aleatório da lista completa para efeito de roleta
      var rnd = allNames[Math.floor(Math.random() * allNames.length)];
      nameEl.textContent = rnd;

      // Nos últimos 500ms desacelera gradualmente
      if (elapsed > totalMs - 500) {
        speed = Math.min(speed + 18, 180);
      }

      if (elapsed >= totalMs) {
        clearInterval(iv);
        onDone();
      }
    }, intervalMs);
  }

  // ─── REVEAL TEAMS ────────────────────────────────────
  function revealTeams(time1, time2) {
    var box = document.getElementById('resultBox');
    box.classList.add('has-result');

    box.innerHTML =
      '<div class="result-label" style="margin-bottom:12px">Times Sorteados</div>' +
      '<div class="teams-result">' +
        buildTeamBox('Time 1', time1, 'team-box-1') +
        buildTeamBox('Time 2', time2, 'team-box-2') +
      '</div>';

    // Revela os boxes com delay escalonado
    var boxes = box.querySelectorAll('.team-box');
    boxes.forEach(function(b, bi) {
      setTimeout(function() {
        b.classList.add('revealed');
        // Revela os jogadores de cada time um por um
        var players = b.querySelectorAll('.team-player');
        players.forEach(function(p, pi) {
          setTimeout(function() {
            p.classList.add('visible');
          }, pi * 160);
        });
      }, bi * 200);
    });
  }

  function buildTeamBox(label, players, id) {
    var playersHtml = players.map(function(p) {
      return '<div class="team-player">' + escapeHtml(p) + '</div>';
    }).join('');
    return '<div class="team-box" id="' + id + '">' +
      '<div class="team-label">' + label + '</div>' +
      playersHtml +
    '</div>';
  }

  // ─── UTILS ───────────────────────────────────────────
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toggleDrawer() {
    document.getElementById('drawer').classList.toggle('open');
    document.getElementById('drawerOverlay').classList.toggle('open');
    document.getElementById('hamburger').classList.toggle('open');
  }

  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
  }
</script>

</body>
</html>

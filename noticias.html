<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trollgers — Notícias</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { outline: none !important; -webkit-tap-highlight-color: transparent !important; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    button { outline: none; }

    :root {
      --bg: #1a0a0a;
      --surface: #2a0f0f;
      --surface2: #3a1515;
      --border: #5a2a2a;
      --gold: #d43333;
      --gold-light: #ff5555;
      --gold-dim: #8a2a2a;
      --blue-glow: #ff6666;
      --text: #e0c4c4;
      --text-dim: #8a6666;
      --red: #ff3333;
    }

    @font-face {
      font-family: 'DropShade';
      src: url('https://files.catbox.moe/bsplgq.ttf');
    }

    body {
      background-color: var(--bg);
      background-image:
        url('https://i.imgur.com/mJoCBsb.png'),
        radial-gradient(ellipse at 20% 0%, rgba(200,30,30,0.10) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(160,20,20,0.07) 0%, transparent 60%);
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: linear-gradient(to bottom, rgba(26,10,10,0.75) 0%, rgba(26,10,10,0.90) 40%, rgba(26,10,10,0.97) 100%);
      pointer-events: none; z-index: 0;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    .page {
      position: relative; z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* HEADER */
    header { padding: 50px 0 36px; text-align: center; }
    .header-line { width: 60px; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); margin: 0 auto 18px; }
    header h1 {
      font-family: 'DropShade', 'Cinzel Decorative', serif;
      font-size: clamp(26px, 6vw, 52px);
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 24px rgba(212,51,51,0.50));
    }
    header p { margin-top: 10px; font-family: 'Cinzel', serif; font-size: clamp(10px, 2vw, 13px); letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); }

    /* BACK LINK */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--surface2);
      padding: 8px 16px;
      border-radius: 4px;
      transition: all 0.2s;
      margin-bottom: 28px;
    }
    .back-link:hover { color: var(--gold-light); border-color: var(--gold-dim); }

    /* CARD — NOTÍCIA */
    .news-card {
      background: linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.5s ease both;
      transition: all 0.3s;
    }

    .news-card::before { 
      content: ''; 
      position: absolute; 
      top: 0; left: 0; right: 0; 
      height: 1px; 
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent); 
    }

    .news-card::after { 
      content: ''; 
      position: absolute; 
      top: -80px; right: -80px; 
      width: 220px; height: 220px; 
      border-radius: 50%; 
      background: radial-gradient(circle, rgba(200,30,30,0.09) 0%, transparent 70%); 
      pointer-events: none; 
    }

    .news-card:hover {
      border-color: var(--gold-dim);
      box-shadow: 0 0 20px rgba(212,51,51,0.15);
    }

    .news-title {
      font-family: 'DropShade', 'Cinzel Decorative', serif;
      font-size: clamp(20px, 4.5vw, 32px);
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 60%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .news-date {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
      display: inline-block;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .news-content {
      font-size: clamp(13px, 2vw, 15px);
      line-height: 1.8;
      color: var(--text);
      position: relative;
      z-index: 1;
    }

    .news-content p {
      margin-bottom: 16px;
    }

    .news-content p:last-child {
      margin-bottom: 0;
    }

    /* LOADING STATE */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      letter-spacing: 0.1em;
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--gold);
      border-radius: 50%;
      margin-left: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* ERROR STATE */
    .error-message {
      background: linear-gradient(160deg, #3a1515 0%, #2a0f0f 100%);
      border: 1px solid #8a2a2a;
      border-radius: 6px;
      padding: 24px;
      text-align: center;
      color: #ff6666;
      font-family: 'Cinzel', serif;
      margin: 40px 0;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state-text {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      letter-spacing: 0.1em;
    }

    /* FEED CONTAINER */
    #feed {
      min-height: 200px;
    }

    /* FOOTER */
    footer {
      position: relative; z-index: 1;
      text-align: center;
      padding: 40px 0;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }

    .footer-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .footer-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      border: 1px solid var(--border);
      background: transparent;
      padding: 8px 16px;
      border-radius: 4px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .footer-btn:hover {
      color: var(--gold-light);
      border-color: var(--gold-dim);
    }

    .footer-btn.active {
      border-color: var(--gold);
      color: var(--gold-light);
    }

    footer p {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-top: 28px;
    }

    /* ANIMATIONS */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .news-card {
        padding: 24px;
      }

      header {
        padding: 40px 0 28px;
      }
    }
  </style>
</head>
<body>

<div class="page">

  <header>
    <div class="header-line"></div>
    <h1>NOTÍCIAS</h1>
    <p>ATUALIZAÇÕES DO IMPERIO TROLLGER</p>
  </header>

  <a href="index.html" class="back-link">← Voltar</a>

  <div id="feed">
    <div class="loading">Carregando notícias...</div>
  </div>

  <footer>
    <div class="footer-label">Navegação</div>
    <div class="footer-links">
      <a href="index.html" class="footer-btn">← Voltar ao Índice</a>
    </div>
    <p>Sistema de notícias — Trollgers © 2026</p>
  </footer>

</div>

<script>
  // Função para carregar e renderizar as notícias
  async function carregarNoticias() {
    const feedContainer = document.getElementById('feed');
    
    try {
      // Fetch do arquivo noticias.json
      const response = await fetch('noticias.json');
      
      if (!response.ok) {
        throw new Error(`Erro ao carregar notícias: ${response.statusText}`);
      }
      
      const data = await response.json();
      const noticias = data.noticias || [];
      
      // Validar se existem notícias
      if (noticias.length === 0) {
        feedContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📰</div>
            <div class="empty-state-text">Nenhuma notícia disponível no momento</div>
          </div>
        `;
        return;
      }
      
      // Ordenar notícias da mais recente para a mais antiga
      // Convertendo a data para comparação (formato dd/mm/yyyy)
      noticias.sort((a, b) => {
        const [diaA, mesA, anoA] = a.data.split('/').map(Number);
        const [diaB, mesB, anoB] = b.data.split('/').map(Number);
        
        const dataA = new Date(anoA, mesA - 1, diaA);
        const dataB = new Date(anoB, mesB - 1, diaB);
        
        return dataB - dataA; // Ordem decrescente (mais recente primeiro)
      });
      
      // Renderizar as notícias
      feedContainer.innerHTML = noticias.map((noticia, index) => `
        <div class="news-card" style="animation-delay: ${index * 0.1}s">
          <div class="news-title">${escapeHtml(noticia.titulo)}</div>
          <div class="news-date">📅 ${escapeHtml(noticia.data)}</div>
          <div class="news-content">
            ${noticia.conteudo.split('\n').filter(p => p.trim()).map(paragrafo => 
              `<p>${escapeHtml(paragrafo)}</p>`
            ).join('')}
          </div>
        </div>
      `).join('');
      
    } catch (erro) {
      console.error('Erro:', erro);
      feedContainer.innerHTML = `
        <div class="error-message">
          ⚠️ Erro ao carregar as notícias<br>
          <small>${escapeHtml(erro.message)}</small>
        </div>
      `;
    }
  }
  
  // Função auxiliar para escapar HTML (segurança)
  function escapeHtml(texto) {
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return texto.replace(/[&<>"']/g, char => map[char]);
  }
  
  // Carregar notícias quando a página carrega
  document.addEventListener('DOMContentLoaded', carregarNoticias);
</script>

</body>
</html>

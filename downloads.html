    body {
      background-color: var(--bg);
      background-image:
        url('https://i.imgur.com/mJoCBsb.png'),
        radial-gradient(ellipse at 20% 0%, var(--gl1) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, var(--gl2) 0%, transparent 60%);
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
      background-attachment: fixed;

    body::before {
      content: '';

      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 24px rgba(212,51,51,0.50));
    }

    header p {
      margin-top: 10px;
      font-family: 'Cinzel', serif;

      text-transform: uppercase;
      color: var(--text-dim);

      padding: 8px 16px;
      border-radius: 4px;
      background: var(--surface2);
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: var(--gold-light);
      border-color: var(--gold-dim);
    }

    /* ── DOWNLOAD CARD ── */
    .download-card {
      background: linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 50px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.7s 0.1s cubic-bezier(0.16,1,0.3,1) both;
    }

    .download-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
    }

    .download-card::after {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,30,30,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .download-icon {
      font-size: 40px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 12px rgba(212,51,51,0.40));
    }

    .download-card h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(14px, 3vw, 20px);
      color: var(--gold-light);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .download-card p {
      font-size: clamp(13px, 2vw, 15px);
      color: var(--text-dim);
      line-height: 1.7;
      margin-bottom: 36px;
    }

    /* ── DOWNLOAD BUTTON ── */
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 36px;
      border-radius: 4px;
      background: linear-gradient(135deg, #2a2010, #1e1a0e);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: clamp(11px, 2vw, 13px);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 24px rgba(212,51,51,0.20), inset 0 0 20px rgba(200,30,30,0.06);
      position: relative;
      z-index: 1;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 36px rgba(212,51,51,0.40), inset 0 0 20px rgba(200,30,30,0.09);
      color: #fff8e8;
    }

    .download-btn:active {
      transform: scale(0.97);
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .wrapper { padding: 0 14px 60px; }
      .download-card { padding: 36px 20px; }
    }

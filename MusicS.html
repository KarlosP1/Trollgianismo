<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ranking de Músicas</title>
<style>
  /* Reset básico */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Fonte e cores */
  body {
    background-color: #121212;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem 1rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    width: 100%;
    max-width: 600px;
  }

  h1 {
    text-align: center;
    color: #ff2e2e;
    font-weight: 900;
    font-size: 2.5rem;
    margin-bottom: 2rem;
    text-shadow: 0 0 10px #ff2e2e88;
  }

  /* Container das cards */
  #ranking-list {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* Card base */
  .music-card {
    background: #1e1e1e;
    border-radius: 16px;
    padding: 1.25rem 1.5rem 1.5rem 1.5rem;
    box-shadow: 0 4px 12px rgb(255 46 46 / 0.2);
    display: flex;
    flex-direction: column;
    animation: fadeInUp 0.6s ease forwards;
    opacity: 0;
    transform: translateY(20px);
    transition: box-shadow 0.3s ease;
    cursor: default;
  }

  /* Aparece com animação */
  .music-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Hover leve */
  .music-card:hover {
    box-shadow: 0 8px 20px rgb(255 46 46 / 0.6);
  }

  /* Top 1 com destaque especial */
  .music-card.top1 {
    background: #2a0000;
    border: 2px solid #ff2e2e;
    box-shadow: 0 0 18px 4px #ff2e2e99;
  }

  /* Ranking number */
  .rank-number {
    font-weight: 900;
    font-size: 2.25rem;
    color: #ff2e2e;
    flex-shrink: 0;
    width: 50px;
    text-align: center;
    user-select: none;
    text-shadow: 0 0 8px #ff2e2eaa;
  }

  /* Conteúdo do card */
  .music-info {
    flex: 1;
    margin-left: 1.25rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Nome da música */
  .music-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #ff2e2e;
    margin-bottom: 0.5rem;
    word-break: break-word;
  }

  /* Player estilizado */
  audio {
    width: 100%;
    outline: none;
    border-radius: 8px;
    background-color: #2c2c2c;
    box-shadow: inset 0 1px 3px #0009;
  }

  /* Responsividade */
  @media (max-width: 480px) {
    body {
      padding: 1rem 0.5rem 2rem;
    }
    main {
      max-width: 100%;
    }
    .rank-number {
      font-size: 1.75rem;
      width: 40px;
      margin-top: 3px;
    }
    .music-title {
      font-size: 1.1rem;
    }
  }

  /* Animação fadeInUp */
  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>
<main>
  <h1>Ranking de Músicas</h1>
  <section id="ranking-list" aria-label="Lista de músicas em ranking">
    <!-- Cards de músicas serão inseridos aqui via JS -->
  </section>
</main>

<script>
/**
 * Array JSON contendo as músicas do ranking.
 * 
 * Para adicionar ou editar uma música, modifique este array.
 * 
 * Cada objeto tem:
 * - title: Nome da música (string)
 * - sources: Array de objetos de fontes de áudio com:
 *     - src: caminho do arquivo (string)
 *     - type: tipo MIME do áudio (string)
 * 
 * ATENÇÃO:
 * - Substitua "NOME_DA_MUSICA" pelo nome real da música.
 * - Substitua "CAMINHO_DA_MUSICA" pelo caminho/URL do arquivo de áudio.
 * - Utilize pelo menos um arquivo .mp3 e um .opus para fallback.
 */
const musicRanking = [
  {
    title: "Speedrun de Unban",
    sources: [
      { src: "CAMINHO_DA_MUSICA_1.mp3", type: "audio/mpeg" },
      { src: "CAMINHO_DA_MUSICA_1.opus", type: "audio/opus" }
    ]
  },
  {
    title: "NOME_DA_MUSICA_2",
    sources: [
      { src: "CAMINHO_DA_MUSICA_2.mp3", type: "audio/mpeg" },
      { src: "CAMINHO_DA_MUSICA_2.opus", type: "audio/opus" }
    ]
  },
  {
    title: "NOME_DA_MUSICA_3",
    sources: [
      { src: "CAMINHO_DA_MUSICA_3.mp3", type: "audio/mpeg" },
      { src: "CAMINHO_DA_MUSICA_3.opus", type: "audio/opus" }
    ]
  },
  {
    title: "NOME_DA_MUSICA_4",
    sources: [
      { src: "CAMINHO_DA_MUSICA_4.mp3", type: "audio/mpeg" },
      { src: "CAMINHO_DA_MUSICA_4.opus", type: "audio/opus" }
    ]
  },
  {
    title: "NOME_DA_MUSICA_5",
    sources: [
      { src: "CAMINHO_DA_MUSICA_5.mp3", type: "audio/mpeg" },
      { src: "CAMINHO_DA_MUSICA_5.opus", type: "audio/opus" }
    ]
  }
];

/**
 * Função para criar e retornar um card HTML para uma música.
 * @param {number} rank - Posição do ranking (1, 2, 3, ...)
 * @param {Object} music - Objeto da música com title e sources
 * @returns {HTMLElement} - Card com conteúdo da música
 */
function createMusicCard(rank, music) {
  const card = document.createElement('article');
  card.className = 'music-card';
  if (rank === 1) {
    card.classList.add('top1');
    card.setAttribute('aria-label', `Top 1: ${music.title}`);
  } else {
    card.setAttribute('aria-label', `Posição ${rank}: ${music.title}`);
  }

  // Número do ranking
  const rankNumber = document.createElement('div');
  rankNumber.className = 'rank-number';
  rankNumber.textContent = `#${rank}`;
  rankNumber.setAttribute('aria-hidden', 'true');

  // Container info (título + player)
  const info = document.createElement('div');
  info.className = 'music-info';

  // Título da música
  const title = document.createElement('h2');
  title.className = 'music-title';
  title.textContent = music.title;

  // Player de áudio
  const audio = document.createElement('audio');
  audio.setAttribute('controls', '');
  audio.setAttribute('preload', 'none');
  audio.setAttribute('aria-label', `Player de áudio da música ${music.title}`);

  // Adiciona as fontes para fallback (mp3, opus)
  music.sources.forEach(source => {
    const srcElem = document.createElement('source');
    srcElem.src = source.src;
    srcElem.type = source.type;
    audio.appendChild(srcElem);
  });

  // Mensagem caso o áudio não seja suportado
  audio.textContent = 'Seu navegador não suporta o elemento de áudio.';

  info.appendChild(title);
  info.appendChild(audio);

  card.appendChild(rankNumber);
  card.appendChild(info);

  return card;
}

/**
 * Função para renderizar todo o ranking de músicas no container.
 */
function renderRanking() {
  const container = document.getElementById('ranking-list');
  container.innerHTML = ''; // limpa

  musicRanking.forEach((music, index) => {
    const rank = index + 1;
    const card = createMusicCard(rank, music);
    container.appendChild(card);

    // Delay da animação para efeito em cascata
    setTimeout(() => {
      card.classList.add('visible');
    }, rank * 150);
  });
}

// Inicializa o ranking ao carregar a página
document.addEventListener('DOMContentLoaded', renderRanking);
</script>
</body>
</html>
```
